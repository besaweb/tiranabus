name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Připravit web s aktuálním feedem
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          cp -r index.html css js data site/
          if ! gh release download tirana-latest -p gtfs.zip -D site; then
            curl -fsSL --retry 3 -o site/gtfs.zip https://pt.tirana.al/gtfs/gtfs.zip
          fi
          unzip -tq site/gtfs.zip

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
