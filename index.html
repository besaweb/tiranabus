<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tirana MHD mapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand">
      <img class="sign" src="img/logo.png" alt="" width="40" height="40">
      <div>
        <h1 data-i18n="title">Tirana MHD mapa</h1>
        <small data-i18n="sub">Městská hromadná doprava</small>
      </div>
    </div>
    <div class="actions">
      <span class="status" id="status" role="status"></span>
      <button type="button" class="theme" id="theme" aria-label="Tmavý režim" title="Tmavý režim"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg></button>
      <div class="lang" role="group" data-i18n-aria="langAria" aria-label="Jazyk">
        <button type="button" data-lang="sq" aria-pressed="false" aria-label="Shqip" title="Shqip"><svg viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="16" fill="#E41E20"/><path fill="#000" d="M12 3.2c-.5-.9-1.6-1.5-2.7-1.3l.6 1.1-1.3.2.9 1.1c-1.4.2-2.5 1-3.2 2.2l1.6.2c-.5.7-.7 1.5-.5 2.3l1.4-.8c.1 1.4.9 2.5 2 3.2l-1.1 2.6h6.2l-1.1-2.6c1.1-.7 1.9-1.8 2-3.2l1.4.8c.2-.8 0-1.6-.5-2.3l1.6-.2c-.7-1.2-1.8-2-3.2-2.2l.9-1.1-1.3-.2.6-1.1c-1.1-.2-2.2.4-2.7 1.3z"/></svg></button>
        <button type="button" data-lang="en" aria-pressed="false" aria-label="English" title="English"><svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="60" height="30" fill="#012169"/><path d="M0 0l60 30M60 0L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0l60 30M60 0L0 30" stroke="#C8102E" stroke-width="2"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></svg></button>
        <button type="button" data-lang="cs" aria-pressed="false" aria-label="Čeština" title="Čeština"><svg viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="8" fill="#fff"/><rect y="8" width="24" height="8" fill="#D7141A"/><path d="M0 0l12 8L0 16z" fill="#11457E"/></svg></button>
      </div>
    </div>
  </header>

  <aside class="side">
    <div class="meta" id="meta"></div>
    <div class="demo" id="expiry" hidden></div>
    <div class="demo" id="demo" data-i18n-html="demo"></div>
    <div class="tabs" role="tablist" data-i18n-aria="mode" aria-label="Režim">
      <button type="button" role="tab" id="tab-plan" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M4 7.5h16"/><circle cx="8" cy="14.5" r=".6"/><circle cx="16" cy="14.5" r=".6"/><path d="M6.5 18v2.5M17.5 18v2.5"/></svg><span data-i18n="tabPlan">Spojení</span></button>
      <button type="button" role="tab" id="tab-browse" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2.3"/><circle cx="18" cy="6" r="2.3"/><path d="M8.3 18H14a3.5 3.5 0 0 0 0-7h-4a3.5 3.5 0 0 1 0-7h5.7"/></svg><span data-i18n="tabBrowse">Linky a zastávky</span></button>
    </div>
    <form class="planform" id="planform" autocomplete="off">
      <div class="od">
        <div class="field"><span class="pin a" aria-hidden="true">A</span><input id="from" data-i18n-ph="fromPh" data-i18n-aria="fromAria" placeholder="Odkud – zastávka" aria-label="Odkud" role="combobox" aria-autocomplete="list"><div class="sugg" id="from-sugg" hidden></div></div>
        <div class="field"><span class="pin b" aria-hidden="true">B</span><input id="to" data-i18n-ph="toPh" data-i18n-aria="toAria" placeholder="Kam – zastávka" aria-label="Kam" role="combobox" aria-autocomplete="list"><div class="sugg" id="to-sugg" hidden></div></div>
        <button type="button" class="btn swap" id="swap" data-i18n-aria="swapAria" data-i18n-title="swap" aria-label="Prohodit Odkud a Kam" title="Prohodit">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2v11M2.5 10.5 5 13l2.5-2.5M11 14V3M8.5 5.5 11 3l2.5 2.5"/></svg>
        </button>
      </div>
      <div class="when">
        <select id="day" data-i18n-aria="dayAria" aria-label="Den"><option value="0" data-i18n="today">Dnes</option><option value="1" data-i18n="tomorrow">Zítra</option></select>
        <input type="time" id="time" step="60" data-i18n-aria="timeAria" aria-label="Čas odjezdu">
        <button type="button" class="btn" id="nowbtn" data-i18n="now">Teď</button>
        <button type="submit" class="btn primary" data-i18n="go">Vyhledat</button>
      </div>
    </form>
    <label class="search" hidden>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
      <input type="search" id="q" data-i18n-ph="searchPh" placeholder="Hledat linku nebo zastávku" autocomplete="off">
    </label>
    <div class="panel" id="panel"></div>
  </aside>

  <div class="mapwrap">
    <div id="map" data-i18n-aria="mapAria" aria-label="Mapa linek a zastávek"></div>
    <div class="tilenote" id="tilenote" hidden><span id="tiletext"></span><button type="button" id="tileclose" data-i18n-aria="close" aria-label="Zavřít">×</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="js/gtfs-core.js"></script>
<script src="js/demo.js"></script>
<script src="js/extra-airport.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
