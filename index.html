<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tirana MHD mapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand">
      <div class="sign" aria-hidden="true">T</div>
      <div>
        <h1>Tirana MHD mapa</h1>
        <small>Prototyp nad GTFS feedem</small>
      </div>
    </div>
    <div class="actions">
      <span class="status" id="status" role="status"></span>
    </div>
  </header>

  <aside class="side">
    <div class="meta" id="meta"></div>
    <div class="demo" id="expiry" hidden></div>
    <div class="demo" id="demo"><b>Smyšlená ukázková síť.</b> Jízdní řády se nepodařilo načíst automaticky. Stáhni gtfs.zip z pt.tirana.al a přetáhni ho na mapu. Soubor se zpracuje jen v prohlížeči.</div>
    <div class="tabs" role="tablist" aria-label="Režim">
      <button type="button" role="tab" id="tab-browse" aria-selected="true">Linky a zastávky</button>
      <button type="button" role="tab" id="tab-plan" aria-selected="false">Spojení</button>
    </div>
    <form class="planform" id="planform" hidden autocomplete="off">
      <div class="od">
        <div class="field"><span class="pin a" aria-hidden="true">A</span><input id="from" placeholder="Odkud – zastávka" aria-label="Odkud" role="combobox" aria-autocomplete="list"><div class="sugg" id="from-sugg" hidden></div></div>
        <div class="field"><span class="pin b" aria-hidden="true">B</span><input id="to" placeholder="Kam – zastávka" aria-label="Kam" role="combobox" aria-autocomplete="list"><div class="sugg" id="to-sugg" hidden></div></div>
        <button type="button" class="btn swap" id="swap" aria-label="Prohodit Odkud a Kam" title="Prohodit">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2v11M2.5 10.5 5 13l2.5-2.5M11 14V3M8.5 5.5 11 3l2.5 2.5"/></svg>
        </button>
      </div>
      <div class="when">
        <select id="day" aria-label="Den"><option value="0">Dnes</option><option value="1">Zítra</option></select>
        <input type="time" id="time" step="60" aria-label="Čas odjezdu">
        <button type="button" class="btn" id="nowbtn">Teď</button>
        <button type="submit" class="btn primary">Vyhledat</button>
      </div>
    </form>
    <label class="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
      <input type="search" id="q" placeholder="Hledat linku nebo zastávku" autocomplete="off">
    </label>
    <div class="panel" id="panel"></div>
  </aside>

  <div class="mapwrap">
    <div id="map" aria-label="Mapa linek a zastávek"></div>
    <div class="tilenote" id="tilenote" hidden><span id="tiletext"></span><button type="button" id="tileclose" aria-label="Zavřít">×</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="js/gtfs-core.js"></script>
<script src="js/demo.js"></script>
<script src="js/extra-airport.js"></script>
<script src="js/app.js"></script>
</body>
</html>
